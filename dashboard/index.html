<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --panel2: #1f242d; --line: #2b323d;
    --text: #e8ecf1; --dim: #8b95a3;
    --ok: #3fb950; --warn: #e3b341; --bad: #f0683c; --dead: #6b7480;
    --n0: #58a6ff; --n1: #c58af9; --n2: #39c5bb; --n3: #f2a04a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, "Segoe UI", sans-serif; padding: 16px 20px 24px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  header .sub { color: var(--dim); }
  #offline { display: none; margin-left: auto; background: var(--bad); color: #000; font-weight: 700;
             padding: 3px 10px; border-radius: 6px; }

  .score { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .tile .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; }
  .tile .value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .hint { color: var(--dim); font-size: 12px; min-height: 17px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  button, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
                   border-radius: 8px; padding: 7px 12px; }
  button { cursor: pointer; font-weight: 600; }
  button:hover { border-color: var(--dim); }
  button:active { transform: translateY(1px); }
  button.heal { background: #1f6f33; border-color: #2c8a43; }
  button.danger { color: #ffb4a0; }
  .group { display: flex; gap: 6px; align-items: center; padding-left: 10px; border-left: 1px solid var(--line); }
  .group span { color: var(--dim); }

  .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: start; }
  .col { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--dead);
         border-radius: 10px; padding: 12px; min-height: 260px; position: relative; }
  .col.connected { border-top-color: var(--ok); }
  .col.isolated { border-top-color: var(--warn); }
  .col.alone_long { border-top-color: var(--bad); }
  .col.crashed { border-top-color: var(--dead); }
  .col.stale .body, .col.crashed .body { opacity: .4; }
  .head { display: flex; align-items: center; gap: 8px; }
  .name { font-size: 20px; font-weight: 700; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px;
           background: var(--dead); color: #000; white-space: nowrap; }
  .connected .badge { background: var(--ok); }
  .isolated .badge { background: var(--warn); }
  .alone_long .badge { background: var(--bad); }
  .stale .badge { background: #000; color: var(--bad); border: 1px solid var(--bad); }
  .meta { color: var(--dim); font-size: 12.5px; margin: 6px 0 8px; min-height: 36px; }
  .meta b { color: var(--text); font-weight: 600; }
  .colbtns { display: flex; gap: 6px; margin-bottom: 10px; }
  .colbtns button { padding: 4px 10px; font-size: 13px; }
  .empty { color: var(--dim); padding: 18px 0; text-align: center; }

  .job { background: var(--panel2); border: 1px solid transparent; border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; }
  .job.mine { border-color: var(--text); }
  .job.done { opacity: .55; }
  .jtop { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .jid { font-weight: 700; font-size: 16px; min-width: 34px; }
  .tag { color: var(--dim); font-size: 11.5px; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .tag.hot { color: var(--warn); border-color: var(--warn); }
  .owner { margin-left: auto; font-weight: 600; }
  .bar { height: 8px; background: #0b0d11; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .bar div { height: 100%; border-radius: 4px; }
  .pct { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 38px; text-align: right; }

  #events { margin-top: 14px; color: var(--dim); font-size: 13px; }
  #events b { color: var(--text); font-weight: 600; }
  @media (max-width: 900px) { .cols, .score { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>Murmuration</h1>
  <span class="sub">four devices, no boss &mdash; each column is what that node believes right now</span>
  <span id="offline">DASHBOARD SERVER UNREACHABLE</span>
</header>

<section class="score">
  <div class="tile"><div class="label">People rescued</div><div class="value" id="s-rescued">&ndash;</div><div class="hint" id="s-rescued-hint"></div></div>
  <div class="tile"><div class="label">Urgent first</div><div class="value" id="s-urgent">&ndash;</div><div class="hint" id="s-urgent-hint"></div></div>
  <div class="tile"><div class="label">Duplicate effort</div><div class="value" id="s-dup">&ndash;</div><div class="hint">jobs worked on by more than one node</div></div>
  <div class="tile"><div class="label">Time to agree after heal</div><div class="value" id="s-agree">&ndash;</div><div class="hint" id="s-agree-hint"></div></div>
</section>

<section class="controls">
  <button class="heal" data-s="heal">Heal all</button>
  <button class="danger" data-s="wifi_down">WiFi down</button>
  <button class="danger" data-s="split" id="b-split">Split</button>
  <button class="danger" data-s="cameras_blind">Cameras blind</button>
  <button class="danger" data-s="flaky">Flaky 30%</button>
  <div class="group">
    <span>Cut link</span><select id="cut-x"></select><span>&ndash;</span><select id="cut-y"></select>
    <button class="danger" id="b-cut">Cut</button>
  </div>
  <div class="group"><button data-s="reset">Reset round</button></div>
</section>

<section class="cols" id="cols"></section>
<div id="events"></div>

<script>
const COLORS = ["var(--n0)", "var(--n1)", "var(--n2)", "var(--n3)"];
const MODE_LABEL = {connected: "CONNECTED", isolated: "ISOLATED", alone_long: "ALONE (taking any job)", crashed: "CRASHED"};
let order = null, color = {}, cols = {};

function esc(v) {
  return String(v).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function $(id) { return document.getElementById(id); }

function post(name, params) {
  return fetch("/scenario/" + name, {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify(params || {})})
    .then(r => r.json()).then(r => { if (!r.ok) alert(r.error); }).catch(() => {});
}

document.querySelectorAll("button[data-s]").forEach(b => b.onclick = () => post(b.dataset.s));
$("b-cut").onclick = () => post("cut", {x: $("cut-x").value, y: $("cut-y").value});

function build(state) {
  order = state.order;
  const wrap = $("cols");
  wrap.innerHTML = "";
  order.forEach((name, i) => {
    color[name] = COLORS[i % COLORS.length];
    const info = state.nodes[name];
    const el = document.createElement("div");
    el.className = "col";
    el.innerHTML =
      '<div class="head"><span class="dot" style="background:' + color[name] + '"></span>' +
      '<span class="name">' + esc(name) + '</span><span class="badge"></span></div>' +
      '<div class="meta"></div><div class="colbtns"></div><div class="body"></div>';
    const btns = el.querySelector(".colbtns");
    const crash = document.createElement("button");
    crash.onclick = () => post(crash.dataset.s, {x: name});
    btns.appendChild(crash);
    let blind = null;
    if (info.zone) {
      blind = document.createElement("button");
      blind.onclick = () => post(blind.dataset.s, {x: name});
      btns.appendChild(blind);
    }
    wrap.appendChild(el);
    cols[name] = {el, badge: el.querySelector(".badge"), meta: el.querySelector(".meta"),
                  body: el.querySelector(".body"), crash, blind};
    for (const id of ["cut-x", "cut-y"]) {
      const o = document.createElement("option");
      o.value = o.textContent = name;
      $(id).appendChild(o);
    }
  });
  if (order.length > 1) $("cut-y").selectedIndex = 1;
  $("b-split").textContent = "Split " + state.split.map(g => g.join("+")).join(" | ");
}

function jobRow(job, current) {
  const pct = Math.round(Math.max(0, Math.min(1, job.progress || 0)) * 100);
  const owner = job.owner;
  const c = owner && color[owner] ? color[owner] : "var(--dead)";
  let tags = '<span class="tag">zone ' + esc(job.zone == null ? "?" : job.zone) + '</span>';
  if (job.epoch > 0) tags += '<span class="tag hot">takeover &times;' + esc(job.epoch) + '</span>';
  if ((job.workers || []).length > 1) tags += '<span class="tag hot">' + job.workers.length + ' workers</span>';
  return '<div class="job' + (job.done ? " done" : "") + (job.id === current ? " mine" : "") + '">' +
    '<div class="jtop"><span class="jid">#' + esc(job.id) + '</span>' + tags +
    '<span class="owner" style="color:' + c + '">' + (job.done ? "&#10003; rescued" : esc(owner || "unclaimed")) + '</span>' +
    '<span class="pct">' + pct + '%</span></div>' +
    '<div class="bar"><div style="width:' + pct + '%;background:' + c + '"></div></div></div>';
}

function render(state) {
  if (!order) build(state);
  for (const name of order) {
    const info = state.nodes[name], t = info.telemetry, col = cols[name];
    const mode = t ? t.mode : null;
    col.el.className = "col " + (info.stale ? "stale" : esc(mode));
    col.badge.textContent = info.stale ? "NO SIGNAL" : (MODE_LABEL[mode] || mode);
    const crashed = mode === "crashed";
    col.crash.textContent = crashed ? "Revive" : "Crash";
    col.crash.dataset.s = crashed ? "revive" : "crash";
    if (col.blind) {
      const blind = t && t.blind;
      col.blind.textContent = blind ? "Unblind camera" : "Blind camera";
      col.blind.dataset.s = blind ? "unblind" : "blind";
    }
    let meta = (info.zone ? "camera, zone " + esc(info.zone) : "no camera") + " &middot; " +
               Math.round(1 / info.speed) + " s per rescue";
    if (!t) {
      col.meta.innerHTML = meta + "<br>never heard from this node";
      col.body.innerHTML = '<div class="empty">waiting for telemetry&hellip;</div>';
      continue;
    }
    meta += "<br>hears: <b>" + (t.reachable.length ? esc(t.reachable.join(", ")) : "nobody") + "</b>";
    if (t.blocked.length) meta += " &middot; blocked: <b>" + esc(t.blocked.join(", ")) + "</b>";
    if (t.blind) meta += ' &middot; <b style="color:var(--warn)">BLIND</b>';
    if (info.stale) meta += ' &middot; last heard ' + info.age.toFixed(0) + ' s ago';
    col.meta.innerHTML = meta;
    const jobs = Object.values(t.jobs).sort((a, b) => a.sev - b.sev || (a.id < b.id ? -1 : 1));
    col.body.innerHTML = jobs.length ? jobs.map(j => jobRow(j, t.current)).join("")
                                     : '<div class="empty">no jobs known</div>';
  }

  const s = state.score;
  $("s-rescued").textContent = s.rescued + " / " + s.total;
  $("s-rescued-hint").textContent = s.total ? (s.total - s.rescued) + " still trapped" : "no cards spotted yet";
  $("s-urgent").textContent = s.urgent_avg_order == null ? "–" : s.urgent_avg_order.toFixed(1);
  $("s-urgent-hint").textContent = s.urgent_ids.length
    ? "avg finish order of " + s.urgent_ids.map(i => "#" + i).join(" ") + " (" + s.urgent_finished + "/" +
      s.urgent_ids.length + " done, best 2.0)"
    : "avg finish order of the 3 most urgent";
  $("s-dup").textContent = s.duplicates;
  if (s.agree_time != null) {
    $("s-agree").textContent = s.agree_time.toFixed(1) + " s";
    $("s-agree-hint").textContent = "all columns show the same rescued set";
  } else if (s.agree_waiting != null) {
    $("s-agree").textContent = s.agree_waiting.toFixed(1) + " s…";
    $("s-agree-hint").textContent = "columns still disagree";
  } else {
    $("s-agree").textContent = "–";
    $("s-agree-hint").textContent = "press Heal all to measure";
  }
  $("events").innerHTML = state.events.slice().reverse()
    .map(e => esc(e.time) + " <b>" + esc(e.text) + "</b>").join(" &nbsp;&middot;&nbsp; ");
}

async function poll() {
  try {
    const r = await fetch("/state", {cache: "no-store"});
    render(await r.json());
    $("offline").style.display = "none";
  } catch (e) {
    $("offline").style.display = "block";
  }
  setTimeout(poll, 300);
}
poll();
</script>
</body>
</html>
